[package]
name = "bolum"
version = "1.0.0"
description = "Local voice dictation with NVIDIA Parakeet and Canary"
authors = ["shivraj598"]
edition = "2021"
rust-version = "1.92"
license = "MIT"

[lib]
name = "bolum_lib"

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["accesskit", "default_fonts", "glow", "x11", "wayland"] }
global-hotkey = "0.7"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
anyhow = "1"
log = "0.4"
env_logger = { version = "0.11", default-features = false }
cpal = "0.18"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
futures-util = "0.3"
sha2 = "0.11"
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "download-binaries", "tls-rustls", "api-24"] }
egui-phosphor = "0.11.0"

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
enigo = { version = "0.6", default-features = false }
tray-icon = { version = "0.21", default-features = false }

[target.'cfg(windows)'.dependencies]
arboard = { version = "3", default-features = false }

[dev-dependencies]
egui_kittest = { version = "0.33.3", features = ["wgpu"] }
hound = "3.5"
http = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# Keep compiler plugins loadable by macOS dyld; the shipped executable is stripped.
[profile.release.build-override]
strip = "none"
