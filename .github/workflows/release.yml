name: Release desktop
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching Cargo.toml
        required: true
        default: v1.0.1
  push:
    tags: ['v1.*']
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-arm64
          - os: windows-2022
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify version matches tag
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "bolum") | .version')
          test "$RELEASE_TAG" = "v$version"
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - name: Package macOS Apple Silicon
        if: runner.os == 'macOS'
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          sh scripts/package-macos.sh
          codesign --verify --deep --strict target/bundle/Bolum.app
          mkdir -p target/dist
          cp target/bundle/Bolum-macos.zip "target/dist/Bolum-${RELEASE_TAG#v}-macos-arm64.zip"
      - name: Package Windows x64
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: target/dist/*.zip
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release-assets
          sha256sum *.zip > SHA256SUMS.txt
          cd ..
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Bolum ${RELEASE_TAG#v}" --notes-file ".github/release-notes/$RELEASE_TAG.md" release-assets/*
